<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Аудио-поиск (Shazam внутри)</title>
<style>
  body{margin:0;background:#12131a;color:#eef0f6;font:15px/1.5 system-ui,sans-serif;padding:14px}
  .wrap{max-width:760px;margin:auto}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:#9aa0b5;font-size:13px;margin-bottom:16px}
  .card{background:#1c1e28;border:1px solid #343849;border-radius:14px;padding:14px;margin-bottom:12px}
  h2{font-size:15px;margin:0 0 10px}
  button{min-height:42px;padding:9px 14px;border:0;border-radius:9px;background:#66cff4;color:#06202b;
    font:inherit;font-weight:600;cursor:pointer;margin:3px}
  button.gray{background:#242734;color:#eef0f6;border:1px solid #343849}
  button:disabled{opacity:.5}
  input[type=file]{display:block;margin:6px 0;font-size:13px}
  .msg{font-size:13px;color:#ffc857;margin-top:8px}
  .msg.ok{color:#5ddba0}.msg.err{color:#ff9db0}
  ul{font-size:13px;color:#c9d4ea;padding-left:18px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Аудио-поиск</h1>
  <div class="sub">Своя база отпечатков: загружаем треки модов, затем ищем по 10-секундному куску из микрофона или файла.</div>

  <div class="card">
    <h2>1. База треков</h2>
    <input type="file" id="dbFiles" accept="audio/*" multiple>
    <button id="buildDb" disabled>Добавить в базу</button>
    <div class="msg" id="msg1"></div>
    <ul id="dbList"></ul>
  </div>

  <div class="card">
    <h2>2. Поиск</h2>
    <input type="file" id="queryFile" accept="audio/*">
    <button id="recMic">Записать 10 сек из микрофона</button>
    <button id="search" disabled>Найти</button>
    <div class="msg" id="msg2"></div>
    <div id="result"></div>
  </div>
</div>
<script src="fingerprint.js"></script>
<script>
(function(){
  'use strict';
  var $=function(id){return document.getElementById(id)};
  var db=new Map(), names=[], queryBuffer=null;

  function say(id,t,kind){var e=$(id);e.textContent=t||'';e.className='msg'+(kind?' '+kind:'')}

  async function decode(f){
    var ctx=new (window.AudioContext||window.webkitAudioContext)();
    try{return await ctx.decodeAudioData(await f.arrayBuffer())}finally{ctx.close()}
  }

  $('dbFiles').addEventListener('change',function(){$('buildDb').disabled=!this.files.length});
  $('buildDb').addEventListener('click',async function(){
    var files=Array.from($('dbFiles').files);
    this.disabled=true;
    for(var i=0;i<files.length;i++){
      try{
        say('msg1','Фингерпринт: '+files[i].name+' ('+(i+1)+'/'+files.length+')...');
        var audio=await decode(files[i]);
        var hs=Fingerprint.hashes(Fingerprint.landmarks(audio));
        var id=names.length;
        Fingerprint.addToDb(db,id,hs);
        names.push({name:files[i].name,hashCount:hs.size,duration:audio.duration});
        var li=document.createElement('li');li.textContent=files[i].name+' — '+hs.size+' хешей, '+audio.duration.toFixed(1)+' с';
        $('dbList').appendChild(li);
      }catch(e){say('msg1','Ошибка на '+files[i].name+': '+e.message,'err')}
    }
    say('msg1','В базе '+names.length+' треков, хешей: '+db.size,'ok');
    $('dbFiles').value=''; this.disabled=true; $('search').disabled=!queryBuffer;
  });

  $('queryFile').addEventListener('change',async function(){
    var f=this.files[0]; if(!f)return;
    try{queryBuffer=await decode(f);say('msg2','Запрос: '+f.name+' ('+queryBuffer.duration.toFixed(1)+' с). Жми «Найти».','ok');$('search').disabled=false}
    catch(e){say('msg2','Ошибка: '+e.message,'err')}
  });

  $('recMic').addEventListener('click',async function(){
    try{
      say('msg2','Записываю 10 секунд... говори ничего, включи музыку погромче.');
      var stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
      var ctx=new (window.AudioContext||window.webkitAudioContext)();
      var src=ctx.createMediaStreamSource(stream), proc=ctx.createScriptProcessor(4096,1,1), chunks=[];
      proc.onaudioprocess=function(e){chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)))};
      src.connect(proc); proc.connect(ctx.destination);
      await new Promise(function(r){setTimeout(r,10000)});
      proc.disconnect(); src.disconnect(); stream.getTracks().forEach(function(t){t.stop()});
      var len=0;chunks.forEach(function(c){len+=c.length});
      var data=new Float32Array(len),p=0;chunks.forEach(function(c){data.set(c,p);p+=c.length});
      var buf=ctx.createBuffer(1,len,ctx.sampleRate);buf.copyToChannel(data,0);
      await ctx.close();
      queryBuffer=buf; $('search').disabled=false;
      say('msg2','Записано '+buf.duration.toFixed(1)+' с. Жми «Найти».','ok');
    }catch(e){say('msg2','Ошибка записи: '+e.message,'err')}
  });

  $('search').addEventListener('click',function(){
    if(!queryBuffer)return;
    say('msg2','Ищу...');
    var hs=Fingerprint.hashes(Fingerprint.landmarks(queryBuffer));
    var m=Fingerprint.match(db,hs);
    if(!m){say('msg2','Совпадений нет — база пустая или звук слишком тихий.','err');return}
    var song=names[m.id];
    $('result').innerHTML='<div class="card"><b>'+escapeHtml(song.name)+'</b><br>'+
      'Совпадений: <b>'+m.count+'</b>, смещение: '+m.offset+' с, длительность '+song.duration.toFixed(1)+' с</div>';
    say('msg2','Нашёл: '+song.name,'ok');
  });
  function escapeHtml(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
})();
</script>
</body>
</html>
