<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Видео → чарт</title>
<style>
  body{margin:0;background:#12131a;color:#eef0f6;font:15px/1.5 system-ui,sans-serif;padding:14px}
  .wrap{max-width:820px;margin:auto}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:#9aa0b5;font-size:13px;margin-bottom:16px}
  .card{background:#1c1e28;border:1px solid #343849;border-radius:14px;padding:14px;margin-bottom:12px}
  h2{font-size:15px;margin:0 0 10px}
  button,.btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;
    padding:9px 14px;border:0;border-radius:9px;background:#66cff4;color:#06202b;font:inherit;
    font-weight:600;cursor:pointer;margin:3px}
  button.gray{background:#242734;color:#eef0f6;border:1px solid #343849}
  button:disabled{opacity:.5;cursor:not-allowed}
  input[type=file]{display:block;margin:6px 0;font-size:13px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
  label{display:block;font-size:12px;color:#9aa0b5;margin:8px 0 4px}
  input[type=number]{width:100%;min-height:42px;background:#242734;border:1px solid #343849;
    border-radius:8px;color:#eef0f6;padding:8px;font:inherit}
  video{width:100%;display:none}
  canvas{width:100%;border:1px solid #343849;border-radius:9px;background:#0e0f15;touch-action:none}
  .msg{font-size:13px;color:#ffc857;margin-top:8px}
  .msg.ok{color:#5ddba0}
  pre{background:#0e0f15;border:1px solid #343849;border-radius:9px;padding:10px;
    max-height:260px;overflow:auto;font:11px/1.4 ui-monospace,Consolas,monospace}
</style>
</head>
<body>
<div class="wrap">
  <h1>Видео → чарт</h1>
  <div class="sub">Прототип: детекция нот по записи геймплея FNF/PAFN. Сначала можно проверить на демо.</div>

  <div class="card">
    <h2>1. Видео</h2>
    <button id="demo">Создать демо-геймплей</button>
    <input type="file" id="videoFile" accept="video/*">
    <input type="file" id="audioFile" accept="audio/*">
    <video id="video" playsinline muted></video>
    <div class="msg" id="msg1"></div>
  </div>

  <div class="card">
    <h2>2. Калибровка поля</h2>
    <div class="sub" style="margin:0 0 8px">Выдели прямоугольник игрового поля (где падают 4 дорожки). На телефоне — пальцем.</div>
    <canvas id="calib"></canvas>
    <div class="grid">
      <div><label>Линия удара: сдвиг вверх, %</label><input type="number" id="hitOffset" value="6" min="0" max="40"></div>
      <div><label>Порог яркости</label><input type="number" id="threshold" value="22" min="3" max="120"></div>
      <div><label>Кулдаун, мс</label><input type="number" id="cooldown" value="90" min="30" max="400"></div>
      <div><label>BPM</label><input type="number" id="bpm" value="128" min="40" max="400"></div>
      <div><label>Сдвиг времени, мс</label><input type="number" id="timeShift" value="0" step="10"></div>
    </div>
    <button id="analyze" disabled>Анализировать</button>
    <div class="msg" id="msg2"></div>
  </div>

  <div class="card">
    <h2>3. Результат</h2>
    <button class="gray" id="dlJson" disabled>Скачать чарт .json</button>
    <button id="dlOsz" disabled>Скачать .osz</button>
    <div class="msg" id="msg3"></div>
    <pre id="preview"></pre>
  </div>
</div>
<script src="../app.js"></script>
<script>
(function(){
  'use strict';
  var $=function(id){return document.getElementById(id)};
  var video=$('video'), calib=$('calib'), cctx=calib.getContext('2d');
  var work=document.createElement('canvas'), wctx=work.getContext('2d',{willReadFrequently:true});
  var rect=null, result=null, vUrl=null;

  function say(id,t,ok){var e=$(id);e.textContent=t||'';e.className='msg'+(ok?' ok':'')}

  // ---------- демо-видео ----------
  function demoChart(){
    var times=[0,469,938,1406,1875,2344,2813,3281,3750,4219,4688,5156];
    var lanes=[0,2,1,3,0,1,2,3,1,2,0,3];
    var notes=[]; for(var i=0;i<times.length;i++)notes.push({time:times[i]+1200,noteData:lanes[i],noteType:''});
    notes.push({time:2100+1200,noteData:1,noteType:'',holdLength:600});
    return notes;
  }

  async function makeDemo(){
    say('msg1','Рендерю демо-видео...');
    var c=document.createElement('canvas'); c.width=640; c.height=360;
    var x=c.getContext('2d');
    var notes=demoChart(), approach=1400, strum=310, last=notes[notes.length-1].time+approach+700;
    var stream=c.captureStream(30);
    var mime=MediaRecorder.isTypeSupported('video/webm;codecs=vp8')?'video/webm;codecs=vp8':'video/webm';
    var rec=new MediaRecorder(stream,{mimeType:mime}), chunks=[];
    rec.ondataavailable=function(e){if(e.data.size)chunks.push(e.data)};
    var done=new Promise(function(res){rec.onstop=res});
    rec.start();
    var t0=performance.now();
    function frame(){
      var now=performance.now()-t0, ms=now;
      x.fillStyle='#0b0c12'; x.fillRect(0,0,640,360);
      var left=200, laneW=60;
      for(var l=0;l<4;l++){ x.fillStyle=l%2?'#171a25':'#131620'; x.fillRect(left+l*laneW,0,laneW,360) }
      x.strokeStyle='#4b5268'; x.lineWidth=2;
      for(var s=0;s<=4;s++){x.beginPath();x.moveTo(left+s*laneW,0);x.lineTo(left+s*laneW,360);x.stroke()}
      x.fillStyle='#66cff4'; x.fillRect(left,strum,laneW*4,5);
      var colors=['#ff6b8a','#ffd166','#6bd6a0','#8da4ff'];
      for(var i=0;i<notes.length;i++){
        var n=notes[i], dl=n.time-ms;
        if(dl>approach||dl<-400) continue;
        var y=strum-(dl/approach)*strum;
        x.fillStyle=colors[n.noteData%4];
        x.fillRect(left+n.noteData*laneW+7,y-16,laneW-14,32);
        if(n.holdLength){var h=n.holdLength/approach*strum;x.globalAlpha=.45;x.fillRect(left+n.noteData*laneW+16,y,laneW-32,h);x.globalAlpha=1}
      }
      if(now<last) requestAnimationFrame(frame); else rec.stop();
    }
    frame(); await done;
    var blob=new Blob(chunks,{type:'video/webm'});
    if(vUrl) URL.revokeObjectURL(vUrl);
    vUrl=URL.createObjectURL(blob);
    video.src=vUrl; await loaded();
    say('msg1','Демо готово: '+video.duration.toFixed(1)+' c, '+notes.length+' нот. Выдели поле и жми «Анализировать».',true);
  }

  function loaded(){
    return new Promise(function(res,rej){
      if(video.readyState>=1) return res();
      video.onloadedmetadata=res; video.onerror=function(){rej(new Error('видео не загрузилось'))};
    });
  }
  function seek(t){
    return new Promise(function(res){video.onseeked=res;video.currentTime=t});
  }

  $('demo').addEventListener('click',async function(){try{await makeDemo()}catch(e){say('msg1','Ошибка: '+e.message)}});
  $('videoFile').addEventListener('change',async function(){
    var f=this.files[0]; if(!f)return;
    if(vUrl)URL.revokeObjectURL(vUrl);
    vUrl=URL.createObjectURL(f); video.src=vUrl;
    try{await loaded(); say('msg1','Видео загружено: '+video.duration.toFixed(1)+' c. Выдели поле.',true)}catch(e){say('msg1',e.message)}
  });

  // ---------- калибровка ----------
  function drawCalib(){
    if(!video.videoWidth)return;
    calib.width=video.videoWidth; calib.height=video.videoHeight;
    cctx.drawImage(video,0,0,calib.width,calib.height);
    if(rect){
      cctx.strokeStyle='#66cff4'; cctx.lineWidth=3; cctx.strokeRect(rect.x,rect.y,rect.w,rect.h);
      var hy=rect.y+rect.h*(1-(+$('hitOffset').value)/100);
      cctx.strokeStyle='#ff5a7a'; cctx.beginPath();cctx.moveTo(rect.x,hy);cctx.lineTo(rect.x+rect.w,hy);cctx.stroke();
    }
  }
  ['loadeddata','seeked'].forEach(function(ev){video.addEventListener(ev,function(){if(!rect)drawCalib()})});
  var drag=null;
  function pt(e){var b=calib.getBoundingClientRect();return{x:(e.clientX-b.left)/b.width*calib.width,y:(e.clientY-b.top)/b.height*calib.height}}
  calib.addEventListener('pointerdown',function(e){drag=pt(e);calib.setPointerCapture(e.pointerId)});
  calib.addEventListener('pointermove',function(e){if(!drag)return;var p=pt(e);rect={x:Math.min(drag.x,p.x),y:Math.min(drag.y,p.y),w:Math.abs(p.x-drag.x),h:Math.abs(p.y-drag.y)};drawCalib()});
  calib.addEventListener('pointerup',function(){drag=null;$('analyze').disabled=!rect||!rect.w||!rect.h;if(rect)say('msg2','Поле выбрано. Можно анализировать.',true)});
  ['hitOffset','threshold','cooldown','bpm'].forEach(function(id){$(id).addEventListener('input',drawCalib)});

  // ---------- анализ ----------
  async function analyze(){
    if(!rect)return;
    var step=1/30, dur=video.duration, frames=[];
    var band=Math.max(10,Math.round(rect.h*0.10));
    var hy=rect.y+rect.h*(1-(+$('hitOffset').value)/100);
    var y0=Math.max(0,Math.min(calib.height-band,Math.round(hy-band/2)));
    work.width=Math.max(4,Math.round(rect.w)); work.height=band;
    $('analyze').disabled=true;
    for(var t=0;t<dur;t+=step){
      await seek(t);
      wctx.drawImage(video,rect.x,y0,work.width,band,0,0,work.width,band);
      var d=wctx.getImageData(0,0,work.width,band).data;
      var vals=[0,0,0,0],cnt=[0,0,0,0];
      for(var yy=0;yy<band;yy++)for(var xx=0;xx<work.width;xx++){
        var i=(yy*work.width+xx)*4, lane=Math.min(3,Math.floor(xx/(work.width/4)));
        vals[lane]+=(d[i]+d[i+1]+d[i+2])/3; cnt[lane]++;
      }
      frames.push({t:t*1000,v:vals.map(function(v,i){return v/cnt[i]})});
      if(Math.round(t/step)%60===0)say('msg2','Кадр '+t.toFixed(1)+' / '+dur.toFixed(1)+' c...');
    }
    // медиана как фон
    var base=[0,0,0,0];
    for(var l=0;l<4;l++){
      var a=frames.map(function(f){return f.v[l]}).sort(function(p,q){return p-q});
      base[l]=a[Math.floor(a.length/2)]||0;
    }
    var thr=+$('threshold').value, cool=+$('cooldown').value, active=[null,null,null,null], notes=[];
    frames.forEach(function(f){
      for(var l=0;l<4;l++){
        var score=f.v[l]-base[l], on=active[l];
        if(score>thr){
          if(!on || f.t-on.start>cool) active[l]={start:f.t,last:f.t};
          else on.last=f.t;
        } else if(on && score<thr*0.55){
          if(f.t-on.last>200) notes.push({songTime:on.start,noteData:l,noteType:'',holdLength:f.t-on.start,hitTime:f.t});
          else notes.push({songTime:on.start,noteData:l,noteType:'',hitTime:f.t});
          active[l]=null;
        }
      }
    });
    active.forEach(function(on,l){if(on)notes.push({songTime:on.start,noteData:l,noteType:''})});
    notes.sort(function(a,b){return a.songTime-b.songTime});
    result={name:'Detected',bpm:+$('bpm').value,speed:1,
      notes:notes.map(function(n){return{songTime:Math.round(n.songTime),noteData:n.noteData,noteType:'',holdLength:n.holdLength||0}}),
      timing:[{offset:0,bpm:+$('bpm').value}],keys:4,warnings:[]};
    var tshift=+$('timeShift').value||0;
    if(tshift) result.notes.forEach(function(n){n.songTime=Math.max(0,n.songTime-tshift)});
    result.notes.forEach(function(n){if(!n.holdLength)delete n.holdLength});
    $('preview').textContent=JSON.stringify(result,null,1).slice(0,4000);
    say('msg2','Готово: найдено '+result.notes.length+' нот, фон = '+base.map(function(b){return b.toFixed(0)}).join('/'),true);
    $('dlJson').disabled=false;
    $('dlOsz').disabled=!$('audioFile').files.length;
    $('analyze').disabled=false;
  }
  $('analyze').addEventListener('click',async function(){try{await analyze()}catch(e){say('msg2','Ошибка: '+e.message);$('analyze').disabled=false}});

  function download(data,name,type){
    var blob=data instanceof Blob?data:new Blob([data],{type:type||'application/octet-stream'});
    var a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(u)},10000);
  }
  $('dlJson').addEventListener('click',function(){
    if(!result)return;
    download(JSON.stringify({song:result},null,2),'detected-chart.json','application/json');
  });
  $('dlOsz').addEventListener('click',async function(){
    if(!result)return;
    var f=$('audioFile').files[0]; if(!f)return;
    var audio=await f.arrayBuffer(), ext=(f.name.split('.').pop()||'mp3').toLowerCase();
    var osu=Fnf2Osu.buildOsu(result,{title:'Detected',audioFile:'audio.'+ext,keys:4});
    var zip=Fnf2Osu.makeZip([{name:'audio.'+ext,data:new Uint8Array(audio)},{name:'Detected (FNF2osu) [Detected].osu',data:osu}]);
    download(zip,'detected.osz','application/zip');
    say('msg3','Готово: detected.osz',true);
  });
})();
</script>
</body>
</html>
